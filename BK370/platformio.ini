[platformio]
default_envs = single, main, remote
src_dir = PlatformIO
build_cache_dir = .pio/cache

[env]
platform = espressif32 @ 8.0.0
board = carriage-esp32s3-n16r8
framework = arduino
build_flags = -Isrc
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    links2004/WebSockets @ 2.7.2

[env:single]
build_flags = ${env.build_flags} -DBK_ROLE=0

[env:main]
build_flags = ${env.build_flags} -DBK_ROLE=1

[env:remote]
build_flags = ${env.build_flags} -DBK_ROLE=2

[env:main_no_ina226]
build_flags = ${env.build_flags} -DBK_ROLE=1 -DBK_NO_INA226

[env:remote_no_ina226]
build_flags = ${env.build_flags} -DBK_ROLE=2 -DBK_NO_INA226

[env:motor_calibration]
build_flags = ${env.build_flags} -DBK_MOTOR_CALIBRATION
monitor_dtr = 0
monitor_rts = 0

[env:motor_calibration_home]
build_flags = ${env.build_flags} -DBK_MOTOR_CALIBRATION_HOME
monitor_dtr = 0
monitor_rts = 0

[env:main_home]
extends = env:main
build_flags = ${env:main.build_flags} -DBK_HOME_WIFI

[env:main_home_no_ina226]
extends = env:main_no_ina226
build_flags = ${env:main_no_ina226.build_flags} -DBK_HOME_WIFI

[env:remote_home]
extends = env:remote
build_flags = ${env:remote.build_flags} -DBK_HOME_WIFI

[env:remote_home_no_ina226]
extends = env:remote_no_ina226
build_flags = ${env:remote_no_ina226.build_flags} -DBK_HOME_WIFI

[env:main_shared]
extends = env:main
build_flags = ${env:main.build_flags} -DBK_SHARED_CABLE

[env:main_shared_no_ina226]
extends = env:main_no_ina226
build_flags = ${env:main_no_ina226.build_flags} -DBK_SHARED_CABLE

[env:remote_shared]
extends = env:remote
build_flags = ${env:remote.build_flags} -DBK_SHARED_CABLE

[env:remote_shared_no_ina226]
extends = env:remote_no_ina226
build_flags = ${env:remote_no_ina226.build_flags} -DBK_SHARED_CABLE

[env:main_home_shared]
extends = env:main
build_flags = ${env:main.build_flags} -DBK_HOME_WIFI -DBK_SHARED_CABLE

[env:main_home_shared_no_ina226]
extends = env:main_no_ina226
build_flags = ${env:main_no_ina226.build_flags} -DBK_HOME_WIFI -DBK_SHARED_CABLE

[env:remote_home_shared]
extends = env:remote
build_flags = ${env:remote.build_flags} -DBK_HOME_WIFI -DBK_SHARED_CABLE

[env:remote_home_shared_no_ina226]
extends = env:remote_no_ina226
build_flags = ${env:remote_no_ina226.build_flags} -DBK_HOME_WIFI -DBK_SHARED_CABLE
