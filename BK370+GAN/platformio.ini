[platformio]
default_envs = bk370_main_ap, gan_remote_ap, gan_calibration
boards_dir = ../BK370/boards
build_cache_dir = ../BK370/.pio/cache

[env]
platform = espressif32 @ 8.0.0
board = carriage-esp32s3-n16r8
framework = arduino
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -I../BK370/src -Isrc
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
board_build.partitions = default_16MB.csv

[pair]
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    links2004/WebSockets @ 2.7.2
build_flags = ${env.build_flags} -DBK_MIXED_GAN

[env:bk370_main_ap]
extends = pair
build_flags = ${pair.build_flags} -DBK_ROLE=1

[env:gan_remote_ap]
extends = pair
build_flags = ${pair.build_flags} -DBK_ROLE=2

[env:bk370_main_home]
extends = env:bk370_main_ap
build_flags = ${env:bk370_main_ap.build_flags} -DBK_HOME_WIFI

[env:gan_remote_home]
extends = env:gan_remote_ap
build_flags = ${env:gan_remote_ap.build_flags} -DBK_HOME_WIFI

[env:gan_calibration]
build_flags = ${env.build_flags} -DGAN_CALIBRATION
